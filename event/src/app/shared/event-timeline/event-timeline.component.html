
<div class="card">
  <h3 class="mb-3">Aperçu du planning</h3>

  <!-- Message si aucune étape valide -->
  <p *ngIf="visibleSteps.length === 0" class="text-gray-500 italic">
    Aucune étape valide à afficher dans la timeline.
  </p>

  <!-- Timeline si étapes valides -->
  <p-timeline 
    *ngIf="visibleSteps.length > 0"
    [value]="visibleSteps"
    align="alternate"
  >
    <!-- Contenu de chaque étape -->
    <ng-template pTemplate="content" let-step>
      <div>
        <strong>{{ step.label }}</strong><br />
        <small>{{ step.time }}</small>
      </div>
    </ng-template>

    <!-- Marqueur visuel -->
    <ng-template pTemplate="marker" let-step>
      <span class="custom-marker">
        <i class="pi" [ngClass]="step.icon || 'pi pi-circle'"></i>
      </span>
    </ng-template>
  </p-timeline>

  <!-- Pour déboguer (optionnel) -->
  <!-- <pre>{{ visibleSteps | json }}</pre> -->
</div>
