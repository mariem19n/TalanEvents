<app-floating-configurator />
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
        <div class="text-center mb-8">
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Créer un compte</div>
          <span class="text-muted-color font-medium">Inscrivez-vous pour commencer</span>
        </div>

        <div *ngIf="errorMessage" class="text-red-500 mb-4 text-center">{{ errorMessage }}</div>

        <label class="block text-surface-900 dark:text-surface-0 text-xl mb-2">Prénom</label>
        <input pInputText [(ngModel)]="firstName" class="w-full mb-4" placeholder="Prénom" />

        <label class="block text-surface-900 dark:text-surface-0 text-xl mb-2">Nom</label>
        <input pInputText [(ngModel)]="lastName" class="w-full mb-4" placeholder="Nom" />

        <label class="block text-surface-900 dark:text-surface-0 text-xl mb-2">Email</label>
        <input pInputText [(ngModel)]="email" class="w-full mb-4" placeholder="Adresse email" />

        <label class="block text-surface-900 dark:text-surface-0 text-xl mb-2">Mot de passe</label>
        <p-password [(ngModel)]="password" placeholder="Mot de passe" [toggleMask]="true" class="mb-4" [feedback]="false" />

        <label class="block text-surface-900 dark:text-surface-0 text-xl mb-2">Confirmer le mot de passe</label>
        <p-password [(ngModel)]="confirmPassword" placeholder="Confirmation" [toggleMask]="true" class="mb-4" [feedback]="false" />

        <p-button label="S'inscrire" styleClass="w-full" (onClick)="register()"></p-button>
      </div>
    </div>
  </div>
</div>
