<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
        <div class="text-center mb-8">
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">
            Réinitialisation du mot de passe
          </div>
          <span class="text-muted-color font-medium">Choisissez un nouveau mot de passe sécurisé</span>
        </div>

        <!-- ✅ Message de succès ou d'erreur -->
        <div *ngIf="message" class="text-center mb-4">
          <p [ngClass]="isError ? 'text-red-500' : 'text-green-600'" class="font-medium">
            {{ message }}
          </p>
        </div>

        <!-- ✅ Formulaire -->
        <div>
          <label for="password" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Nouveau mot de passe</label>
          <input
            pInputText
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Nouveau mot de passe"
            class="w-full md:w-[30rem] mb-4"
          />

          <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Confirmer le mot de passe</label>
          <input
            pInputText
            id="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirmez votre mot de passe"
            class="w-full md:w-[30rem] mb-6"
          />

          <p-button label="Valider" styleClass="w-full mb-4" (onClick)="resetPassword()"></p-button>

          <div class="text-center mt-2">
            <a routerLink="/auth/login" class="text-primary font-medium hover:underline">Retour à la connexion</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
