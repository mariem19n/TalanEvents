<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
        <div class="text-center mb-8">
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Mot de passe oublié</div>
          <span class="text-muted-color font-medium">Entrez votre adresse email pour recevoir un lien</span>
        </div>

        <div *ngIf="message" class="text-green-600 text-center mb-4">{{ message }}</div>
        <div *ngIf="error" class="text-red-500 text-center mb-4">{{ error }}</div>

        <div>
          <label for="email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
          <input pInputText id="email" type="email" [(ngModel)]="email" placeholder="Votre adresse email" class="w-full md:w-[30rem] mb-6" />
          <p-button label="Envoyer le lien" styleClass="w-full" (onClick)="sendResetLink()"></p-button>

          <div class="mt-6 text-center">
            <a routerLink="/auth/login" class="text-primary font-medium hover:underline">Retour à la connexion</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
