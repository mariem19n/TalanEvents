<p-table [value]="filteredEvents()" [paginator]="true" [rows]="10" [rowHover]="true" dataKey="id" class="p-datatable-sm">

  <ng-template pTemplate="header">
    <tr>
      <th>Titre</th>
      <th>Date</th>
      <th>Début</th>
      <th>Fin</th>
      <th>Lieu</th>
      <th>Statut</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-event>
    <tr>
      <td>{{ event.title }}</td>
      <td>{{ event.eventDate }}</td>
      <td>{{ event.startTime }}</td>
      <td>{{ event.endTime }}</td>
      <td>{{ event.location }}</td>
      <td>
        <p-tag [value]="event.status" [severity]="getSeverity(event.status)"></p-tag>
      </td>
    </tr>
  </ng-template>

</p-table>
